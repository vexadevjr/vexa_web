# Render Blueprint: one web service. Express serves /api/* and the built React app.
services:
  - type: web
    name: vexa-development
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      # Optional: restrict CORS to specific origins (comma separated)
      # - key: CORS_ORIGIN
      #   value: https://your-domain.com
